# Checks the E2E testing tutorial on every pull request that touches it: the
# generated files are current and the site builds. The built site is kept as an
# artifact to look at; pages.yml publishes it at /e2e-testing/.

name: E2E testing tutorial - site

on:
  pull_request:
    paths:
      - "e2e-testing/**"
      - ".github/workflows/e2e-testing-site.yml"
  push:
    branches: [main]
    paths:
      - "e2e-testing/**"
      - ".github/workflows/e2e-testing-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-testing-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e-testing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the tools
        run: pip install -r requirements.txt

      - name: The catalog page matches products.json
        run: python catalog/build_catalog.py --check

      - name: The template archive matches the template
        run: python tools/build_template_zip.py --check

      - name: The agent kit carries the current template and example
        run: python tools/build_agent_kit.py --check

      - name: The sample handouts build
        run: python admin/handouts/build_handouts.py --inventory admin/handouts/inventory.sample.json --no-pdf --out "${RUNNER_TEMP}/handouts"

      - name: Build the site
        run: mkdocs build --strict --site-dir "${RUNNER_TEMP}/site"

      - name: Upload the site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-testing-site
          path: ${{ runner.temp }}/site
          retention-days: 7
