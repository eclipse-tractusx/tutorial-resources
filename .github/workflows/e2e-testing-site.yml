# Checks the E2E testing tutorial on every pull request that touches it, and
# publishes it as a site when it changes on main. The site goes into its own
# folder of the gh-pages branch, next to what other workflows publish there.

name: E2E testing tutorial - site

on:
  pull_request:
    paths:
      - "e2e-testing/**"
      - ".github/workflows/e2e-testing-site.yml"
  push:
    branches: [main]
    paths:
      - "e2e-testing/**"
      - ".github/workflows/e2e-testing-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-testing-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e-testing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the tools
        run: pip install -r requirements.txt

      - name: The catalog page matches products.json
        run: python catalog/build_catalog.py --check

      - name: The template archive matches the template
        run: python tools/build_template_zip.py --check

      - name: The sample handouts build
        run: python admin/handouts/build_handouts.py --inventory admin/handouts/inventory.sample.json --no-pdf --out "${RUNNER_TEMP}/handouts"

      - name: Build the site
        run: mkdocs build --strict --site-dir "${RUNNER_TEMP}/site"

      - name: Upload the site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-testing-site
          path: ${{ runner.temp }}/site
          retention-days: 7

  publish:
    name: Publish
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'eclipse-tractusx/tutorial-resources'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-testing-site
          path: site

      - name: Publish to gh-pages, folder e2e-testing
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: e2e-testing
          keep_files: true
