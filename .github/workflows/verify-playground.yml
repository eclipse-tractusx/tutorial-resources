---
name: Verify playground

on:
  pull_request:
    branches:
      - main
    paths:
      - 'edc-policy-playground/**'
  push:
    branches: [main]
    paths:
      - 'edc-policy-playground/**'

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run dash
        id: run-dash
        uses: eclipse-tractusx/sig-infra/.github/actions/run-dash@1a2be9d3b599c081a4a307d8124f33d209f7c54e # main
        with:
          dash_input: "edc-policy-playground/package-lock.json"
  check-playground:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edc-policy-playground
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 18
      - name: Run npm ci
        run: npm ci

      - name: Run npm lint
        run: npm run lint

      - name: Run npm test
        run: npm test
