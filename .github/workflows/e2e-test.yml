# Reusable workflow: validate, compile and run an E2E test project (a TCK
# project) against a Tractus-X dataspace that is created inside the runner.
#
# A product repository calls it in a few lines:
#
#   jobs:
#     e2e:
#       uses: eclipse-tractusx/tutorial-resources/.github/workflows/e2e-test.yml@main
#       with:
#         tck-directory: tck/e2e
#
# Job "validate" needs nothing but Python. Job "e2e" starts the Eclipse
# Tractus-X developer toolbox: a kind cluster in the runner with two
# connectors, two wallets (IdentityHub), a Digital Twin Registry, a BDRS and an
# IssuerService, deployed from the Tractus-X Umbrella chart with a small
# dataspace configuration. It issues the participants' credentials, and then
# runs the compiled package against it.
# No secrets and no external cluster are used.
#
# The developer toolbox is part of the Tractus-X Starter Kit. This workflow
# uses its action, which holds the bring-up, the helper scripts and the Helm
# values:
#   https://github.com/eclipse-tractusx/tractusx-starter-kit/tree/main/developer-toolbox

name: E2E test (TCK)

on:
  workflow_call:
    inputs:
      tck-directory:
        description: Folder that holds the E2E test project (its index.yaml).
        type: string
        default: tck/e2e
      testlab-version:
        description: Version of tractusx-testlab on PyPI that validates, compiles and runs the project.
        type: string
        default: "1.0.0a25"
      run-in-toolbox:
        description: Run the tests in the Eclipse Tractus-X developer toolbox, a dataspace created in the runner. Set to false to only validate and compile.
        type: boolean
        default: true
      config:
        description: Optional run configuration (a YAML file with "variables:") in the calling repository. It is merged over the developer toolbox's values.
        type: string
        default: ""
      toolbox-values:
        description: Optional extra Helm values file for the developer toolbox in the calling repository, applied last. Use it to deploy the image built from this pull request.
        type: string
        default: ""
      testlab-ci-ref:
        description: Deprecated and ignored. The developer toolbox now comes from the Tractus-X Starter Kit, with its own helper scripts and Helm values.
        type: string
        default: e75ebb96ee3793fab2372213868df3296094da1c

permissions:
  contents: read

env:
  # The runner has no terminal: keep PASS, FAIL and SKIP coloured in the log,
  # and approve a run's checkpoints up front.
  FORCE_COLOR: "1"
  TESTLAB_YES: "1"
  TCK_DIR: ${{ inputs.tck-directory }}
  TCK_OUT: dist/e2e-test.tck
  TESTLAB_VERSION: ${{ inputs.testlab-version }}

jobs:
  validate:
    name: Validate and compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      # One workflow may call this one several times (one call per test
      # project). The folder name keeps their artifacts apart.
      - name: Name this project's artifacts
        id: slug
        run: echo "slug=$(printf '%s' "${TCK_DIR}" | tr -c 'A-Za-z0-9._-' '-')" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install TestLab
        run: pip install "tractusx-testlab==${TESTLAB_VERSION}"

      - name: testlab validate
        run: testlab validate "${TCK_DIR}/index.yaml"

      - name: testlab compile
        run: |
          mkdir -p dist
          testlab compile "${TCK_DIR}/index.yaml" --output "${TCK_OUT}"

      - name: testlab inspect — what the package says it will do
        run: |
          testlab inspect "${TCK_OUT}" --variables --infrastructure
          {
            echo '### E2E test project'
            echo '```text'
            NO_COLOR=1 FORCE_COLOR=0 testlab inspect "${TCK_OUT}" --variables --infrastructure
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the compiled package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-test-package-${{ steps.slug.outputs.slug }}
          path: ${{ env.TCK_OUT }}
          retention-days: 14

  e2e:
    name: Run in Eclipse Tractus-X developer toolbox
    needs: validate
    if: ${{ inputs.run-in-toolbox }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CALLER_CONFIG: ${{ inputs.config }}

    steps:
      # ------------------------------------------------------------------
      # 1. The test project and TestLab
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install TestLab
        run: pip install "tractusx-testlab==${TESTLAB_VERSION}"

      - name: Download the compiled package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-test-package-${{ needs.validate.outputs.slug }}
          path: dist

      # ------------------------------------------------------------------
      # 2. The dataspace: the Eclipse Tractus-X developer toolbox, from the
      #    Tractus-X Starter Kit
      # ------------------------------------------------------------------
      - name: Start the Eclipse Tractus-X developer toolbox
        id: toolbox
        uses: eclipse-tractusx/tractusx-starter-kit/developer-toolbox@main
        with:
          extra-values: ${{ inputs.toolbox-values }}

      # ------------------------------------------------------------------
      # 3. Run the E2E test project against the live dataspace
      # ------------------------------------------------------------------
      - name: Prepare execution trace directory
        run: |
          sudo mkdir -p /data
          sudo chmod 0777 /data

      - name: Write the run configuration
        env:
          TOOLBOX_VARIABLES: ${{ steps.toolbox.outputs.variables-file }}
        run: |
          set -euo pipefail
          # The developer toolbox's values (fixed and discovered), and then
          # whatever the calling repository adds or overrides.
          python - <<'PY'
          import os
          import pathlib

          import yaml

          variables = yaml.safe_load(pathlib.Path(os.environ["TOOLBOX_VARIABLES"]).read_text())["variables"]
          caller = os.environ.get("CALLER_CONFIG", "")
          if caller:
              variables.update(yaml.safe_load(pathlib.Path(caller).read_text()).get("variables") or {})
          pathlib.Path("run-config.yaml").write_text(yaml.safe_dump({"variables": variables}, sort_keys=True))
          print("\n".join(f"{key}" for key in sorted(variables)))
          PY

      - name: testlab run
        run: |
          set -o pipefail
          testlab run "${TCK_OUT}" \
            --config run-config.yaml \
            --logs-dir logs \
            --data-dir /data

      - name: Put the result on the run page
        if: always()
        run: |
          transcript="$(find logs -type f -name '*.log' 2>/dev/null | sort | tail -n 1)"
          {
            echo '### E2E test result'
            if [ -n "${transcript}" ]; then
              echo '```text'
              sed -e 's/\x1b\[[0-9;]*m//g' "${transcript}" | awk '/TCK RUN SUMMARY/ { show = 1 } show' | tail -n 40
              echo '```'
            else
              echo 'The run wrote no transcript: it did not start. See the job log.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Collect cluster diagnostics
        if: ${{ failure() || cancelled() }}
        uses: eclipse-tractusx/tractusx-starter-kit/developer-toolbox/diagnostics@main
        with:
          namespace: ${{ steps.toolbox.outputs.namespace || 'umbrella' }}
          output-dir: ci-logs

      - name: Upload the run's logs and execution trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-test-run-${{ needs.validate.outputs.slug }}
          path: |
            logs
            /data
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload cluster diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toolbox-diagnostics-${{ needs.validate.outputs.slug }}
          path: ci-logs/
          retention-days: 14

      - name: Delete kind cluster
        if: always()
        env:
          TOOLBOX_CLUSTER: ${{ steps.toolbox.outputs.cluster-name }}
        run: kind delete cluster --name "${TOOLBOX_CLUSTER:-tck-e2e}" || true
