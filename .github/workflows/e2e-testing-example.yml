# Keeps the examples of the E2E testing tutorial honest. The worked example and the
# template are validated, compiled and run in the Eclipse Tractus-X developer toolbox
# whenever they or the reusable workflow change. The hello example of chapter 3 runs
# against the hello service, started from e2e-testing/hello-service in the runner.

name: E2E testing tutorial - worked example

on:
  pull_request:
    paths:
      - "e2e-testing/examples/**"
      - "e2e-testing/template/**"
      - "e2e-testing/hello-service/**"
      - ".github/workflows/e2e-test.yml"
      - ".github/workflows/e2e-testing-example.yml"
  push:
    branches: [main]
    paths:
      - "e2e-testing/examples/**"
      - "e2e-testing/template/**"
      - "e2e-testing/hello-service/**"
      - ".github/workflows/e2e-test.yml"
      - ".github/workflows/e2e-testing-example.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-testing-example-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  digital-twin-registry:
    name: Digital Twin Registry
    uses: ./.github/workflows/e2e-test.yml
    with:
      tck-directory: e2e-testing/examples/digital-twin-registry/tck/e2e

  template:
    name: Template
    uses: ./.github/workflows/e2e-test.yml
    with:
      tck-directory: e2e-testing/template/tck/e2e

  hello:
    name: Hello, TestLab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TESTLAB_VERSION: "1.0.0a25"
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Start the hello service
        working-directory: e2e-testing/hello-service
        run: |
          docker run -d --name hello-service -p 8080:8080 \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/site:/usr/share/nginx/html:ro" \
            nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
          for _ in $(seq 1 30); do curl -fsS http://localhost:8080/health && exit 0; sleep 1; done
          docker logs hello-service
          exit 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install TestLab
        run: pip install "tractusx-testlab==${TESTLAB_VERSION}"

      - name: Validate, compile and run
        working-directory: e2e-testing/examples/hello/tck/hello
        run: |
          testlab validate index.yaml
          testlab compile index.yaml -o "$RUNNER_TEMP/hello.tck"
          testlab run index.yaml --yes --var service_url=http://localhost:8080
