# Keeps the worked example of the E2E testing tutorial honest: it is validated,
# compiled and run in the Eclipse Tractus-X developer toolbox whenever it, the template or
# the reusable workflow changes.

name: E2E testing tutorial - worked example

on:
  pull_request:
    paths:
      - "e2e-testing/examples/**"
      - "e2e-testing/template/**"
      - ".github/workflows/e2e-test.yml"
      - ".github/workflows/e2e-testing-example.yml"
  push:
    branches: [main]
    paths:
      - "e2e-testing/examples/**"
      - "e2e-testing/template/**"
      - ".github/workflows/e2e-test.yml"
      - ".github/workflows/e2e-testing-example.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-testing-example-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  digital-twin-registry:
    name: Digital Twin Registry
    uses: ./.github/workflows/e2e-test.yml
    with:
      tck-directory: e2e-testing/examples/digital-twin-registry/tck/e2e

  template:
    name: Template
    uses: ./.github/workflows/e2e-test.yml
    with:
      tck-directory: e2e-testing/template/tck/e2e
