# The look every page of https://eclipse-tractusx.github.io/tutorial-resources/
# shares: the header (logo, title, search, repository, About, light/dark), the
# footer, the colours and the Markdown features. The home page
# (pages/mkdocs.yml), the E2E testing tutorial (e2e-testing/mkdocs.yml) and the
# Markdown tutorials (.github/scripts/build_markdown_sites.py) all start from it:
#
#   INHERIT: ../pages/theme/mkdocs-base.yml
#
# MkDocs reads the paths below from the folder of the config that inherits
# them, so they are written for a mkdocs.yml one folder below the repository
# root. A site adds its own name, address, navigation and extra.tutorial
# (what its About panel shows); a list it sets replaces the list here.

repo_url: https://github.com/eclipse-tractusx/tutorial-resources
repo_name: eclipse-tractusx/tutorial-resources
copyright: >-
  Copyright &copy; Contributors to the Eclipse Foundation ·
  <a href="https://github.com/eclipse-tractusx/tutorial-resources/blob/main/LICENSE_non-code">CC-BY-4.0</a> (content) ·
  <a href="https://github.com/eclipse-tractusx/tutorial-resources/blob/main/LICENSE">Apache-2.0</a> (code) ·
  <a href="https://github.com/eclipse-tractusx/tutorial-resources/blob/main/NOTICE.md">Notice</a>

theme:
  name: material
  custom_dir: ../pages/theme/overrides
  logo: assets/tractusx/logo_tractus-x.svg
  favicon: assets/tractusx/favicon.ico
  font:
    text: Manrope
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
    - toc.follow

extra_css:
  - assets/tractusx/tractusx.css

extra:
  # The logo leads to the list of all tutorials, from every site.
  homepage: https://eclipse-tractusx.github.io/tutorial-resources/

# The "About" button in the header and the panel it opens.
hooks:
  - ../pages/theme/hooks/about.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - github-callouts
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

plugins:
  - search
