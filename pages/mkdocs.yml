# The home page of the website, built with the same theme as every tutorial
# site, so it has the same header and footer. Its body is index.html; its
# pictures and styles are in home/.
#
#   pip install -r ../e2e-testing/requirements.txt
#   mkdocs serve          # preview on http://localhost:8000

INHERIT: theme/mkdocs-base.yml

site_name: Eclipse Tractus-X Tutorials
site_description: "Hands-on tutorials for Eclipse Tractus-X: run a dataspace, write connector policies, give your product an end-to-end test."
site_url: https://eclipse-tractusx.github.io/tutorial-resources/
docs_dir: home

extra_css:
  - assets/tractusx/tractusx.css
  - stylesheets/home.css

hooks:
  - theme/hooks/preview.py
  - theme/hooks/about.py
  - hooks/home.py

# The About panel: the whole repository, its history and its authors.
extra:
  tutorial:
    folder: ""
    heading: About these tutorials

# The home page has its own search for the tutorials, under the title.
plugins: []
