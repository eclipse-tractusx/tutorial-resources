# The manifest of an E2E test project: what is tested, what a run needs,
# and which tests belong to it. One file per test lives in tests/.

kind: tck
syntax: v1-alpha

id: digital-twin-registry-e2e

metadata:
  name: "Digital Twin Registry — E2E test"
  version: "v0.1.0"
  description: >
    Proves the Digital Twin Registry does its job in a running dataspace:
    a twin its owner registers can be read back, a partner finds and reads
    it through the owner's connector, and a twin that does not exist is
    answered with "not found".
  authors:
    - name: Eclipse Tractus-X contributors
      company: Eclipse Tractus-X
  copyright_holders:
    - "2026 Contributors to the Eclipse Foundation"
  license: Apache-2.0
  standards:
    - id: CX-0002
      version: v2.3.0
  tags:
    - e2e
    - digital-twin-registry

dataspace:
  ecosystem: Catena-X
  version: saturn

# What a run needs. "sut" is the system under test (the product and the
# connector in front of it); "engine" is the side the tests run from.
infrastructure:
  engine:
    connector:
      required: true
  sut:
    connector:
      required: true
    dtr:
      required: true

env:
  variables:
    - id: engine_bpnl
      uses: variable/type/string
      name: BPN of the test side
      description: >
        Business partner number of the participant the tests run from,
        e.g. BPNL000000000002. The twin is made visible to this partner.
      with:
        source: input
        scope: engine
      returns:
        value:
          type: string

    - id: dtr_internal_url
      uses: variable/type/string
      name: Registry API, as the owner's connector reaches it
      description: >
        Address of the registry API as the data plane of the connector under
        test can reach it, e.g.
        http://provider-dtr.umbrella.svc.cluster.local:8080/api/v3.
      with:
        source: input
        scope: sut
      returns:
        value:
          type: string

    - id: access_policy
      uses: config/connector/policy
      name: Who may see the registry offer
      with:
        source: value
        value:
          policy_id: dtr-e2e-access-policy
          permissions:
            - action: access
              constraints:
                - left_operand: Membership
                  operator: eq
                  right_operand: active
      returns:
        value:
          type: object
          class: Policy

    - id: usage_policy
      uses: config/connector/policy
      name: What a partner may use the registry for
      with:
        source: value
        value:
          policy_id: dtr-e2e-usage-policy
          permissions:
            - action: use
              constraints:
                - and:
                    - left_operand: Membership
                      operator: eq
                      right_operand: active
                    - left_operand: FrameworkAgreement
                      operator: eq
                      right_operand: "DataExchangeGovernance:1.0"
                    - left_operand: UsagePurpose
                      operator: isAnyOf
                      right_operand:
                        - "cx.core.digitalTwinRegistry:1"
      returns:
        value:
          type: object
          class: Policy

  schemas:
    - id: shell_descriptor
      source: shell_descriptor.json

tests:
  - id: register_and_read.yaml
    name: A registered twin can be read back and matches the AAS schema
  - id: partner_reads_through_connector.yaml
    name: A partner finds and reads the twin through the owner's connector
  - id: unknown_twin_is_not_found.yaml
    name: A twin that does not exist is answered with 404
