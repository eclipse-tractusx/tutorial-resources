kind: test
syntax: v1-alpha

namespace: digital-twin-registry-e2e
id: unknown-twin-is-not-found

metadata:
  name: "An unknown twin is not found"
  version: "v0.1.0"
  description: >
    Negative test. Asks the registry for a twin it has never held and
    expects 404. A registry that answers 200 here is inventing data.

execution:
  - id: read_unknown_twin
    uses: connector/dataplane/http_request
    name: Read a twin ID the registry has never held
    with:
      dataplane_url: "${{ infrastructure.sut.dtr.base_url }}"
      # "urn:uuid:e2e-absent", base64url-encoded as the AAS API expects.
      path: "/api/v3/shell-descriptors/dXJuOnV1aWQ6ZTJlLWFic2VudA"
      edr_token: ""
      method: GET
    validate:
      - uses: validate/assert
        with: { input: status_code, operator: equals, value: 404 }
