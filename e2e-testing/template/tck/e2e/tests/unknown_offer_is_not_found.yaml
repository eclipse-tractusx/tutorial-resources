kind: test
syntax: v1-alpha

namespace: my-product-e2e # TODO: the id from index.yaml
id: unknown-offer-is-not-found

metadata:
  name: "An unknown offer is not found"
  version: "v0.1.0"
  description: >
    Negative test. Asks the catalog for an asset that was never published and
    expects an empty answer. Replace it with the refusal that matters most
    for your product.

execution:
  - id: catalog_for_nothing
    uses: connector/consumer/query_catalog_with_filters
    name: Ask the catalog for an asset that was never published
    with:
      counter_party_address: "${{ infrastructure.sut.connector.dsp_url }}"
      counter_party_id: "${{ infrastructure.sut.connector.participant_id }}"
      filters:
        - operand_left: "https://w3id.org/edc/v0.0.1/ns/id"
          operator: "="
          operand_right: "my-product-e2e-asset-that-does-not-exist"
    returns:
      datasets:
        type: array
    validate:
      - uses: validate/assert
        with: { input: datasets, operator: length_equals, value: 0 }
