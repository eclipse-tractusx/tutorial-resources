# Values for a run in the Tractus-X Umbrella the workflow creates. The
# connector addresses and identities are filled in by the workflow itself;
# this file only adds what is specific to your product.
#
# The template points at the small echo service the workflow deploys, so it
# passes before you have changed anything. TODO: put the in-cluster address of
# your product here, e.g. http://my-product.umbrella.svc.cluster.local:8080.

variables:
  product_internal_url: "http://tck-echo.umbrella.svc.cluster.local"
