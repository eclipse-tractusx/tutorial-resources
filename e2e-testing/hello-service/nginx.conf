# The hello service: a tiny read-only API for the first test of the E2E
# testing tutorial. Stock nginx answers from the JSON files in site/; there is
# no code to build. Every answer is JSON, errors included.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  default_type application/json;
  server_tokens off;
  add_header Access-Control-Allow-Origin "*" always;

  location = /hello         { limit_except GET { deny all; } try_files /hello.json =404; }
  location = /health        { limit_except GET { deny all; } try_files /health.json =404; }
  location = /parts         { limit_except GET { deny all; } try_files /parts.json =404; }
  location ~ "^/parts/([A-Za-z0-9-]{1,32})$" { limit_except GET { deny all; } try_files /part-$1.json =404; }
  location = /openapi.yaml  { default_type application/yaml; try_files /openapi.yaml =404; }
  location = /              { return 302 /openapi.yaml; }
  location /                { return 404; }

  error_page 403 405 =405 /error-405.json;
  error_page 404 /error-404.json;
  location = /error-404.json { internal; }
  location = /error-405.json { internal; }
}
