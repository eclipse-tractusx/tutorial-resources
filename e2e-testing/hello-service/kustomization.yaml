# Deploys the hello service into the current namespace:
#
#   kubectl apply -k e2e-testing/hello-service -n <namespace>
#
# Change the host name in the patch below to the address the participants use.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - hello-service.yaml

configMapGenerator:
  - name: hello-service-nginx
    files:
      - default.conf=nginx.conf
  - name: hello-service-site
    files:
      - site/hello.json
      - site/health.json
      - site/parts.json
      - site/part-P-1001.json
      - site/part-P-1002.json
      - site/error-404.json
      - site/error-405.json
      - site/openapi.yaml

patches:
  - target:
      kind: Ingress
      name: hello-service
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: hello.example.org
      - op: replace
        path: /spec/tls/0/hosts/0
        value: hello.example.org
