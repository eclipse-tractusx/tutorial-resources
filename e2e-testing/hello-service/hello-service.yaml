apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-service
  labels:
    app.kubernetes.io/name: hello-service
    app.kubernetes.io/part-of: e2e-testing-tutorial
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-service
        app.kubernetes.io/part-of: e2e-testing-tutorial
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d, readOnly: true }
            - { name: site, mountPath: /usr/share/nginx/html, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: nginx-conf
          configMap: { name: hello-service-nginx }
        - name: site
          configMap: { name: hello-service-site }
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: hello-service
  labels:
    app.kubernetes.io/name: hello-service
spec:
  selector:
    app.kubernetes.io/name: hello-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-service
  labels:
    app.kubernetes.io/name: hello-service
spec:
  tls:
    - hosts: [hello.example.org]
      secretName: hello-service-tls
  rules:
    - host: hello.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-service
                port:
                  name: http
