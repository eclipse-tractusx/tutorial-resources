# Copy this file to .github/workflows/e2e-test.yml in your repository.
# It validates and compiles the E2E test project on every pull request and
# runs it in the Eclipse Tractus-X developer toolbox, a dataspace created
# inside the runner.

name: E2E test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E test
    uses: eclipse-tractusx/tutorial-resources/.github/workflows/e2e-test.yml@main
    with:
      tck-directory: tck/e2e
