kind: test
syntax: v1-alpha

namespace: digital-twin-registry-e2e
id: register-and-read

metadata:
  name: "Register and read"
  version: "v0.1.0"
  description: >
    Positive and contract test. The owner registers a twin (a shell
    descriptor), reads it back, and both answers are held to the AAS shell
    descriptor schema. The twin is removed again at the end.

execution:
  - id: new_twin_id
    uses: util/generate_uuid
    name: Mint a twin ID unique to this run
    returns:
      value:
        type: string

  - id: create_shell
    uses: digital-twin-registry/provider/create_shell_descriptor
    name: Register the twin
    with:
      shell_descriptor:
        id: "urn:uuid:${{ execution.new_twin_id.value }}"
        idShort: "e2eTwin"
        specificAssetIds:
          - name: "manufacturerPartId"
            value: "e2e-part-4711"
            externalSubjectId:
              type: ExternalReference
              keys:
                - type: GlobalReference
                  value: "${{ infrastructure.sut.connector.participant_id }}"
        submodelDescriptors:
          - id: "urn:uuid:${{ execution.new_twin_id.value }}-submodel"
            idShort: "e2eSubmodel"
            semanticId:
              type: ExternalReference
              keys:
                - type: GlobalReference
                  value: "urn:samm:io.catenax.part_type_information:1.0.0#PartTypeInformation"
            endpoints:
              - interface: "SUBMODEL-3.0"
                protocolInformation:
                  href: "${{ infrastructure.sut.connector.dsp_url }}"
                  endpointProtocol: "HTTP"
                  endpointProtocolVersion: ["1.1"]
                  subprotocol: "DSP"
                  subprotocolBody: "id=dtr-e2e-asset;dspEndpoint=${{ infrastructure.sut.connector.dsp_url }}"
                  subprotocolBodyEncoding: "plain"
                  securityAttributes:
                    - type: "NONE"
                      key: "NONE"
                      value: "NONE"
    returns:
      id:
        type: string
    validate:
      - uses: validate/assert
        with: { input: id, operator: equals, value: "urn:uuid:${{ execution.new_twin_id.value }}" }
      - uses: validate/schema
        with: { input: body, schema: "${{ env.schemas.shell_descriptor }}" }

  - id: read_back_shell
    uses: digital-twin-registry/provider/get_shell_descriptor
    name: Read the twin back
    with:
      aas_identifier: "urn:uuid:${{ execution.new_twin_id.value }}"
      bpn: "${{ infrastructure.sut.connector.participant_id }}"
    returns:
      id:
        type: string
      id_short:
        type: string
    validate:
      - uses: validate/assert
        with: { input: id, operator: equals, value: "urn:uuid:${{ execution.new_twin_id.value }}" }
      - uses: validate/assert
        with: { input: id_short, operator: equals, value: "e2eTwin" }
      - uses: validate/schema
        with: { input: body, schema: "${{ env.schemas.shell_descriptor }}" }
      - uses: validate/field
        with:
          input: body
          path: "specificAssetIds[name='manufacturerPartId'].value"
          operator: equals
          value: "e2e-part-4711"

teardown:
  - id: delete_shell
    uses: digital-twin-registry/provider/delete_shell_descriptor
    name: Remove the twin
    with:
      aas_identifier: "urn:uuid:${{ execution.new_twin_id.value }}"
    returns:
      status_code:
        type: integer
    validate:
      - uses: validate/assert
        with: { input: status_code, operator: equals, value: 204 }
