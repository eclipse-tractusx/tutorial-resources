kind: tck
syntax: v1-alpha

id: hello-e2e

metadata:
  name: "Hello, TestLab"
  version: "v0.1.0"
  description: >
    My first test project, written by hand: the hello service says hello.
  authors:
    - name: Eclipse Tractus-X contributors
      company: Eclipse Tractus-X
  license: Apache-2.0
  tags:
    - hello

env:
  variables:
    - id: service_url
      uses: variable/type/string
      name: Address of the hello service
      description: >
        Where the hello service answers, without a slash at the end. At the
        workshop it is on your handout; on your laptop it is
        http://localhost:8080.
      with:
        source: value
        value: "http://localhost:8080"
      returns:
        value:
          type: string

# Add one line per test file in tests/ here.
tests: []
